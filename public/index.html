  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>

  <script>
  // Theme runtime — MUST stay inline and in <head>: the `dark` class has to
  // land on <html> before first paint or the cream page flashes on a dark
  // device. `.dark` on <html> is the platform idiom (matches the Tailwind
  // `darkMode: 'class'` config below and usernode-native's own .dark block).
  (function () {
    var KEY = 'ctl_theme';
    var MODES = { light: 1, dark: 1, system: 1 };
    var mem = null;            // fallback when localStorage is unavailable
    var ephemeral = false;     // true when ?theme= is driving this page load
    var subs = [];

    function read() {
      if (ephemeral) return mem;
      try {
        var v = localStorage.getItem(KEY);
        if (v && MODES[v]) return v;
      } catch (_) {}
      return mem && MODES[mem] ? mem : 'system';
    }
    function write(mode) {
      mem = mode;
      if (ephemeral) return;
      try { localStorage.setItem(KEY, mode); } catch (_) {}
    }
    function prefersDark() {
      try { return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
      catch (_) { return false; }
    }
    function resolved() {
      var m = read();
      return m === 'system' ? (prefersDark() ? 'dark' : 'light') : m;
    }
    function apply() {
      var r = resolved();
      var el = document.documentElement;
      if (r === 'dark') el.classList.add('dark');
      else el.classList.remove('dark');
      return r;
    }
    function notify() {
      var mode = read(), r = resolved();
      for (var i = 0; i < subs.length; i++) {
        try { subs[i](mode, r); } catch (_) {}
      }
    }

    // ?theme=light|dark|system — screenshot / test deep link. Applies for
    // this page load only and never overwrites a real user's saved choice.
    try {
      var q = new URLSearchParams(location.search).get('theme');
      if (q && MODES[q]) { ephemeral = true; mem = q; }
    } catch (_) {}

    apply();

    try {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var onSystemChange = function () { apply(); notify(); };
      if (mq.addEventListener) mq.addEventListener('change', onSystemChange);
      else if (mq.addListener) mq.addListener(onSystemChange);
    } catch (_) {}

    window.ctlTheme = {
      get: read,
      resolved: resolved,
      set: function (mode) {
        if (!MODES[mode]) return read();
        write(mode);
        apply();
        notify();
        return mode;
      },
      onChange: function (cb) {
        if (typeof cb !== 'function') return function () {};
        subs.push(cb);
        return function () { subs = subs.filter(function (f) { return f !== cb; }); };
      },
    };
  })();
  </script>

  <link rel="stylesheet" href="https://social-vibecoding.usernodelabs.org/usernode-native/v1/native.css">
  <script src="https://social-vibecoding.usernodelabs.org/usernode-native/v1/native.js"></script>

  <style>
    /* Every colour in the app routes through these tokens; `html.dark`
       below is the only place dark values live. Tier ramp colours are
       fixed by position and live in app.js — they are NOT themed. */
    :root {
      color-scheme: light;
      --paper: #FAF6EE; --paper-deep: #F3EDDF; --ink: #1F2B47; --ink-soft: #5A6378;
      --line: #E7DFCC; --accent: #7c3aed;
      /* surfaces */
      --card: #ffffff;
      --card-line-hover: #d9c8f5;
      --field-bg: #ffffff;
      --sheet-bg: #ffffff;
      --header-bg: rgba(250,246,238,.94);
      --header-rule: var(--ink);
      --hero-grad: linear-gradient(135deg, #ffffff, #f4eefe);
      --peek-bg: #7c3aed10;
      /* recessed / dashed */
      --drop-line: #cfc6ab;
      --drop-active-bg: #7c3aed14;
      /* shadows + overlay */
      --shadow-card: rgba(31,43,71,.08);
      --shadow-drag: rgba(31,43,71,.28);
      --shadow-sheet: rgba(31,43,71,.25);
      --backdrop: rgba(31,43,71,.45);
      /* badge tints (bg + fg pairs) */
      --tint-accent-bg: #7c3aed22; --tint-accent-fg: #6a50bd;
      --tint-warn-bg: #E5A83B33; --tint-warn-fg: #8a6415; --tint-warn-line: #E5A83B66;
      --tint-danger-bg: #FF6B5722; --tint-danger-fg: #b0361f;
      --tint-neutral-bg: #eeeeee; --tint-neutral-fg: #666666;
      /* semantic text */
      --ok-fg: #4d7325;
      --danger-fg: #b0361f;
      --link: #3F97E8;
      /* toast fallback (dark surface in BOTH modes — the iOS HUD idiom) */
      --toast-bg: #1F2B47; --toast-fg: #FAF6EE;
      /* native kit overrides */
      --un-accent: #7c3aed;
      --un-group-bg: #ffffff;
      --un-hairline: #E7DFCC;
    }
    html.dark {
      color-scheme: dark;
      --paper: #14161F; --paper-deep: #1B1F2B; --ink: #ECEAE3; --ink-soft: #A3AABB;
      --line: #2E3342; --accent: #A78BFA;
      --card: #1E222E;
      --card-line-hover: #4c3f7a;
      --field-bg: #191D28;
      --sheet-bg: #1E1E38;
      --header-bg: rgba(20,22,31,.90);
      --header-rule: #2E3342;
      --hero-grad: linear-gradient(135deg, #1E222E, #262040);
      --peek-bg: rgba(167,139,250,.10);
      --drop-line: #3A4152;
      --drop-active-bg: rgba(167,139,250,.16);
      --shadow-card: rgba(0,0,0,.45);
      --shadow-drag: rgba(0,0,0,.6);
      --shadow-sheet: rgba(0,0,0,.55);
      --backdrop: rgba(0,0,0,.6);
      --tint-accent-bg: rgba(167,139,250,.22); --tint-accent-fg: #C9B7FB;
      --tint-warn-bg: rgba(229,168,59,.22); --tint-warn-fg: #EBC172; --tint-warn-line: rgba(229,168,59,.5);
      --tint-danger-bg: rgba(255,107,87,.20); --tint-danger-fg: #F4A093;
      --tint-neutral-bg: rgba(255,255,255,.10); --tint-neutral-fg: #A3AABB;
      --ok-fg: #9ECB6E;
      --danger-fg: #F4A093;
      --link: #7CBBF2;
      --toast-bg: rgba(58,58,82,.96); --toast-fg: #F4F4F8;
      /* let usernode-native's own .dark values apply, retinted to our accent */
      --un-accent: #A78BFA;
      --un-group-bg: #1E222E;
      --un-hairline: #2E3342;
    }
    body { background: var(--paper); color: var(--ink); font-family: Inter, system-ui, sans-serif; }
    .font-display { font-family: Fraunces, Georgia, serif; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
    .card-tap { transition: border-color 140ms ease, transform 140ms ease, box-shadow 140ms ease; }
    @media (hover: hover) {
      .card-tap:hover:not(:active) {
        border-color: var(--card-line-hover);
        transform: translateY(-1px);
        box-shadow: 0 2px 8px var(--shadow-card);
      }
    }
    .chev { color: var(--ink-soft); font-size: 18px; line-height: 1; font-weight: 600; opacity: .55; flex: none; }
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--card); border: 1px solid var(--line); border-radius: 9px;
      padding: 6px 10px; font-size: 13px; font-weight: 600; color: var(--ink);
      min-height: 34px; touch-action: none; user-select: none; -webkit-user-select: none;
      cursor: grab; max-width: 100%;
    }
    .chip img { width: 20px; height: 20px; border-radius: 4px; object-fit: cover; }
    .chip.selected { outline: 2px solid var(--accent); outline-offset: 1px; }
    .chip.dragging { opacity: 0.35; }
    .chip-ghost {
      position: fixed; z-index: 90; pointer-events: none;
      transform: translate(-50%, -60%) scale(1.06) rotate(-2deg);
      box-shadow: 0 8px 24px var(--shadow-drag); cursor: grabbing;
    }
    .tier-row { display: flex; gap: 6px; align-items: stretch; }
    .tier-label {
      width: 44px; min-height: 52px; border-radius: 10px; display: grid; place-items: center;
      color: #fff; font-family: Fraunces, serif; font-weight: 900; font-size: 17px; flex: none;
      text-align: center; padding: 2px; word-break: break-word; line-height: 1.05;
    }
    .tier-items {
      flex: 1; background: var(--paper-deep); border: 1.5px dashed var(--drop-line); border-radius: 10px;
      padding: 6px; display: flex; flex-wrap: wrap; gap: 5px; align-content: flex-start; min-height: 52px;
    }
    .tier-items.drop-target { border-color: var(--accent); background: var(--drop-active-bg); }
    .dist-bar { height: 10px; border-radius: 5px; min-width: 2px; }
    .sheet-backdrop { position: fixed; inset: 0; background: var(--backdrop); z-index: 60; }
    .sheet-panel {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; background: var(--sheet-bg);
      max-width: 576px; margin-inline: auto;
      border-radius: 18px 18px 0 0; max-height: 82vh; overflow-y: auto;
      padding: 14px 16px calc(18px + env(safe-area-inset-bottom));
      box-shadow: 0 -10px 40px var(--shadow-sheet);
    }
    .btn-primary {
      background: var(--ink); color: var(--paper); font-weight: 800; border-radius: 12px;
      padding: 13px 18px; letter-spacing: .02em; width: 100%; text-align: center;
    }
    .btn-primary:disabled { opacity: .4; }
    html.dark .btn-primary:disabled { opacity: .32; }
    .badge { font-size: 10px; font-weight: 800; letter-spacing: .06em; border-radius: 99px; padding: 1px 7px; white-space: nowrap; flex: none; }
    input, textarea, select {
      background: var(--field-bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px;
      font-size: 15px; color: var(--ink); width: 100%;
    }
    input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
    /* Appearance segmented control (Profile → APPEARANCE) */
    .seg {
      display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px;
      background: var(--paper-deep); border: 1px solid var(--line);
      border-radius: 12px; padding: 4px;
    }
    .seg-btn {
      min-height: 44px; border-radius: 9px; font-size: 13.5px; font-weight: 700;
      color: var(--ink); background: transparent; letter-spacing: .01em;
    }
    .seg-btn[aria-checked="true"] { background: var(--accent); color: var(--un-accent-contrast, #fff); }
  </style>
</head>
<body>
  <div id="app"><div class="p-8 text-center" style="color:var(--ink-soft)">Loading…</div></div>
  <script src="/app.js"></script>
</body>
</html>
