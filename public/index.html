  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });

  })();
  </script>

  <script>
  // Theme runtime — MUST stay inline and in <head>: the `dark` class has to
  // land on <html> before first paint or the cream page flashes on a dark
  // device. `.dark` on <html> is the platform idiom (matches the Tailwind
  // `darkMode: 'class'` config below and usernode-native's own .dark block).
  (function () {
    var KEY = 'ctl_theme';
    var MODES = { light: 1, dark: 1, system: 1 };
    var mem = null;            // fallback when localStorage is unavailable
    var ephemeral = false;     // true when ?theme= is driving this page load
    var subs = [];

    function read() {
      if (ephemeral) return mem;
      try {
        var v = localStorage.getItem(KEY);
        if (v && MODES[v]) return v;
      } catch (_) {}
      return mem && MODES[mem] ? mem : 'system';
    }
    function write(mode) {
      mem = mode;
      if (ephemeral) return;
      try { localStorage.setItem(KEY, mode); } catch (_) {}
    }
    function prefersDark() {
      try { return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
      catch (_) { return false; }
    }
    function resolved() {
      var m = read();
      return m === 'system' ? (prefersDark() ? 'dark' : 'light') : m;
    }
    function apply() {
      var r = resolved();
      var el = document.documentElement;
      if (r === 'dark') el.classList.add('dark');
      else el.classList.remove('dark');
      return r;
    }
    function notify() {
      var mode = read(), r = resolved();
      for (var i = 0; i < subs.length; i++) {
        try { subs[i](mode, r); } catch (_) {}
      }
    }

    // ?theme=light|dark|system — screenshot / test deep link. Applies for
    // this page load only and never overwrites a real user's saved choice.
    try {
      var q = new URLSearchParams(location.search).get('theme');
      if (q && MODES[q]) { ephemeral = true; mem = q; }
    } catch (_) {}

    apply();

    try {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var onSystemChange = function () { apply(); notify(); };
      if (mq.addEventListener) mq.addEventListener('change', onSystemChange);
      else if (mq.addListener) mq.addListener(onSystemChange);
    } catch (_) {}

    window.ctlTheme = {
      get: read,
      resolved: resolved,
      set: function (mode) {
        if (!MODES[mode]) return read();
        write(mode);
        apply();
        notify();
        return mode;
      },
      onChange: function (cb) {
        if (typeof cb !== 'function') return function () {};
        subs.push(cb);
        return function () { subs = subs.filter(function (f) { return f !== cb; }); };
      },
    };
  })();
  </script>

  <style>
    /* Every colour in the app routes through these tokens; `html.dark`
       below is the only place dark values live (derived from the light
       contract). Tier ramp pastels live in app.js and item illustrations in
       illustrations.js — neither is themed. */
    :root {
      color-scheme: light;
      --paper: #E7E5E0; --paper-deep: #DCD9D3; --ink: #1E1B18; --ink-soft: #625D55; --ink-faint: #8B867E;
      --line: #D2CEC7; --accent: #9C4A30; --on-accent: #FAF9F6;
      --card: #FAF9F6;
      --card-line-hover: #D2CEC7;
      --field-bg: #FAF9F6;
      --sheet-bg: #FAF9F6;
      --header-bg: rgba(231,229,224,.92);
      --header-rule: transparent;
      --hero-grad: var(--card);
      --peek-bg: #EFE6A0;
      --hint-bg: #DCE3D2;
      --drop-line: #B9B4AC;
      --drop-active-bg: rgba(156,74,48,.10);
      --shadow-card: rgba(30,27,24,.07);
      --shadow-drag: rgba(30,27,24,.28);
      --shadow-sheet: rgba(30,27,24,.18);
      --backdrop: rgba(30,27,24,.45);
      --tint-accent-bg: rgba(156,74,48,.14); --tint-accent-fg: #7E3A24;
      --tint-warn-bg: #EDCB8066; --tint-warn-fg: #6E4E12; --tint-warn-line: #EDCB80;
      --tint-danger-bg: rgba(156,74,48,.14); --tint-danger-fg: #8A3F27;
      --tint-neutral-bg: #E2DFD9; --tint-neutral-fg: #625D55;
      --ok-fg: #3F6A2A;
      --danger-fg: #8A3F27;
      --link: #1E1B18;
      --toast-bg: #1E1B18; --toast-fg: #FAF9F6;
      --un-accent: #9C4A30;
      --un-group-bg: #FAF9F6;
      --un-hairline: #D2CEC7;
    }
    html.dark {
      color-scheme: dark;
      --paper: #1B1916; --paper-deep: #22201C; --ink: #EFECE6; --ink-soft: #B3ACA2; --ink-faint: #8B847A;
      --line: #3A3631; --accent: #C97B5E; --on-accent: #1E1B18;
      --card: #262320;
      --card-line-hover: #3A3631;
      --field-bg: #211F1C;
      --sheet-bg: #2A2723;
      --header-bg: rgba(27,25,22,.92);
      --peek-bg: #4A4526;
      --hint-bg: #34402D;
      --drop-line: #4D4842;
      --drop-active-bg: rgba(201,123,94,.16);
      --shadow-card: rgba(0,0,0,.4);
      --shadow-drag: rgba(0,0,0,.6);
      --shadow-sheet: rgba(0,0,0,.55);
      --backdrop: rgba(0,0,0,.6);
      --tint-accent-bg: rgba(201,123,94,.22); --tint-accent-fg: #E7AA92;
      --tint-warn-bg: rgba(237,203,128,.2); --tint-warn-fg: #EDCB80; --tint-warn-line: rgba(237,203,128,.5);
      --tint-danger-bg: rgba(201,123,94,.22); --tint-danger-fg: #E7AA92;
      --tint-neutral-bg: rgba(255,255,255,.08); --tint-neutral-fg: #B3ACA2;
      --ok-fg: #A9CC8A;
      --danger-fg: #E7AA92;
      --link: #EFECE6;
      --toast-bg: #3A3631; --toast-fg: #EFECE6;
      --un-accent: #C97B5E;
      --un-group-bg: #262320;
      --un-hairline: #3A3631;
    }
    body { background: var(--paper); color: var(--ink); font-family: Archivo, system-ui, sans-serif; }
    .font-display, .serif { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-weight: 400; font-synthesis: none; letter-spacing: 0; }
    .font-display.font-black, .font-display.font-bold { font-weight: 400; }
    .ital { font-style: italic; }
    .cond { font-family: 'Archivo Narrow', 'Arial Narrow', Archivo, sans-serif; font-weight: 500; text-transform: uppercase; letter-spacing: .02em; }
    sup.cnt { font-size: 55%; vertical-align: super; line-height: 0; margin-left: 1px; }
    .card { background: var(--card); border: none; border-radius: 22px; }
    .card-tap { transition: transform 140ms ease, box-shadow 140ms ease; }
    @media (hover: hover) {
      .card-tap:hover:not(:active) { transform: translateY(-1px); box-shadow: 0 6px 16px var(--shadow-card); }
    }
    .chev { color: var(--ink-soft); font-size: 18px; line-height: 1; font-weight: 600; opacity: .55; flex: none; }
    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      background: var(--card); border: 1px solid var(--line); border-radius: 12px;
      padding: 6px 10px; font-size: 13px; font-weight: 500; color: var(--ink);
      min-height: 34px; max-width: 100%;
    }
    .tier-row { display: flex; gap: 6px; align-items: stretch; }
    .tier-items {
      flex: 1; background: var(--card); border-radius: 14px;
      padding: 6px; display: flex; flex-wrap: wrap; gap: 4px; align-content: center; min-height: 60px;
    }
    .tier-items.empty { background: transparent; border: 1.5px dashed var(--drop-line); justify-content: center; align-items: center; }
    .tier-items.drop-target { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--drop-active-bg); }
    .tier-items.placeable { cursor: pointer; }
    .tblock {
      width: 52px; min-height: 60px; border-radius: 14px; display: grid; place-items: center; flex: none;
      color: #1E1B18; font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; line-height: 1.05;
      text-align: center; padding: 2px; word-break: break-word;
    }
    .tblock.small { font-size: 18px; }
    button.tblock { cursor: pointer; }
    html.dark .tblock, html.dark .tchip, html.dark .dist-bar { filter: brightness(.88); }
    .dist-bar { height: 12px; border-radius: 6px; min-width: 2px; }
    .tchip { display: inline-block; border-radius: 9px; padding: 1px 8px; color: #1E1B18; font-family: 'Instrument Serif', Georgia, serif; font-size: 15px; line-height: 1.35; white-space: nowrap; }
    .sheet-backdrop { position: fixed; inset: 0; background: var(--backdrop); z-index: 60; }
    .sheet-panel {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; background: var(--sheet-bg);
      max-width: 576px; margin-inline: auto;
      border-radius: 24px 24px 0 0; max-height: 82vh; overflow-y: auto;
      padding: 14px 16px calc(18px + env(safe-area-inset-bottom));
      box-shadow: 0 -10px 40px var(--shadow-sheet);
    }
    .btn-primary {
      background: var(--ink); color: var(--paper); font-weight: 600; border-radius: 999px;
      padding: 13px 18px; letter-spacing: .01em; width: 100%; text-align: center; min-height: 44px;
    }
    .btn-primary:disabled { opacity: .4; }
    html.dark .btn-primary:disabled { opacity: .32; }
    .badge { font-size: 10px; font-weight: 700; letter-spacing: .05em; border-radius: 99px; padding: 1px 7px; white-space: nowrap; flex: none; }
    input, textarea, select {
      background: var(--field-bg); border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px;
      font-size: 15px; color: var(--ink); width: 100%;
    }
    input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .seg {
      display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px;
      background: var(--paper-deep); border-radius: 14px; padding: 4px;
    }
    .seg-btn { min-height: 44px; border-radius: 10px; font-size: 13.5px; font-weight: 600; color: var(--ink); background: transparent; }
    .seg-btn[aria-checked="true"] { background: var(--accent); color: var(--on-accent); }

    /* ---------- shared redesign pieces ---------- */
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
    .topbar button, .topbar a { font-family: 'Instrument Serif', Georgia, serif; font-size: 19px; min-height: 44px; min-width: 44px; color: var(--ink); }
    .topbar .dim { color: var(--ink-soft); }
    .circle {
      border-radius: 50%; background: var(--accent); color: var(--on-accent); flex: none;
      font-family: 'Instrument Serif', Georgia, serif; display: grid; place-items: center; text-align: center; line-height: 1.05;
      width: 88px; height: 88px; font-size: 20px; padding: 6px;
      transition: transform 160ms ease;
    }
    .circle:active { transform: scale(.96); }
    .circle:disabled { opacity: .4; }
    .circle.md { width: 64px; height: 64px; font-size: 15px; }
    .pill { display: inline-flex; align-items: center; justify-content: center; border-radius: 999px; background: var(--ink); color: var(--paper); padding: 10px 16px; min-height: 44px; font-size: 14px; font-weight: 500; }
    .pill.accent { background: var(--accent); color: var(--on-accent); }
    .pill:disabled { opacity: .4; }
    .linkish { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; color: var(--ink-soft); min-height: 44px; display: inline-flex; align-items: center; }
    .fig { display: inline-flex; flex-direction: column; align-items: center; text-align: center; flex: none; }
    .fig .cap { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 11.5px; line-height: 1.1; color: var(--ink-soft); max-width: 72px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; margin-top: 1px; }
    .illo { display: inline-grid; place-items: center; flex: none; }
    .illo img { width: 100%; height: 100%; display: block; object-fit: contain; pointer-events: none; -webkit-user-drag: none; }
    .illo.photo img { object-fit: cover; border-radius: 12px; }
    /* official logo / poster: shown as-is (no rotation, no restyling) on white */
    .illo.official { background: #FFFFFF; border-radius: 10px; padding: 3px; box-shadow: 0 1px 4px var(--shadow-card); overflow: hidden; }
    .illo.official img { object-fit: contain; }
    /* name-only tile: the fallback when an item has no image or drawing */
    .illo.nametile { border-radius: 12px; color: #1E1B18; padding: 4px; text-align: center; overflow: hidden;
      font-family: 'Archivo Narrow', 'Arial Narrow', Archivo, sans-serif; font-weight: 600; text-transform: uppercase; letter-spacing: .01em; line-height: 1.05; }
    .illo.nametile > span { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; word-break: break-word; }
    .illo.tile { border-radius: 14px; }
    .tabs { display: flex; gap: 16px; flex-wrap: wrap; }
    .tabs button { font-family: 'Instrument Serif', Georgia, serif; font-size: 21px; color: var(--ink-faint); min-height: 44px; }
    .tabs button[aria-selected="true"] { color: var(--ink); }
    .kicker { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; color: var(--ink-soft); }

    /* ---------- Home ---------- */
    .hm-nav { display: flex; justify-content: space-between; align-items: flex-start; }
    .hm-nav .links { display: flex; flex-direction: column; font-family: 'Instrument Serif', Georgia, serif; font-size: 19px; line-height: 1.2; }
    .hm-nav .links a, .hm-nav .links button { color: var(--ink-soft); min-height: 30px; text-align: left; }
    .hm-nav .links .on { color: var(--ink); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
    .hero { position: relative; background: var(--card); border-radius: 27px; padding: 16px; min-height: 270px; box-shadow: 0 10px 24px var(--shadow-card); }
    .hero .ht { font-size: 27px; line-height: 1.02; max-width: 62%; }
    .hero .ed { position: absolute; top: 16px; right: 16px; font-size: 13.5px; text-align: right; }
    .hero .scatter { position: relative; height: 118px; margin: 10px -4px 4px; }
    .hero .scatter .fig { position: absolute; width: 64px; }
    .hero .meta { font-size: 14px; max-width: calc(100% - 100px); }
    .hero .circle { position: absolute; right: 14px; bottom: 12px; }
    .reveal { animation: illoIn 420ms ease both; }
    @keyframes illoIn { from { opacity: 0; transform: translateY(6px) rotate(var(--r, 0deg)); } to { opacity: 1; } }
    .row2 { display: flex; gap: 10px; }
    .cont-card { position: relative; flex: 1.5; background: var(--card); border-radius: 22px; padding: 12px; min-height: 120px; text-align: left; }
    .grp-card { flex: 1; background: var(--card); border-radius: 22px; padding: 12px 14px; text-align: left; min-height: 64px; }
    .cont-card + .grp-card { min-height: 120px; }
    .cont-card .circle { position: absolute; right: -6px; bottom: -10px; box-shadow: 0 6px 16px var(--shadow-card); }
    .progline { height: 2px; background: var(--line); border-radius: 2px; }
    .progline i { display: block; height: 2px; background: var(--ink); border-radius: 2px; }
    .stack { display: flex; flex-direction: column; }
    .stk { position: relative; border-radius: 22px; margin-top: -10px; box-shadow: 0 -4px 14px var(--shadow-card); color: #1E1B18; transition: margin 500ms cubic-bezier(.2,1.3,.4,1); }
    .stk:first-child { margin-top: 0; }
    .stk-strip { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px 14px 18px; min-height: 64px; transition: min-height 500ms cubic-bezier(.2,1.2,.4,1), padding 500ms ease; }
    .stk-ic { width: 34px; height: 34px; border-radius: 50%; background: #FAF9F6; display: grid; place-items: center; flex: none; overflow: hidden; }
    .stk .cat { display: block; font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 12px; color: rgba(30,27,24,.7); }
    .stk .tt { display: block; font-size: 15px; line-height: 1.1; }
    .stk .nr { margin-left: auto; font-family: 'Instrument Serif', Georgia, serif; font-size: 13.5px; color: rgba(30,27,24,.8); white-space: nowrap; }
    .stk-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 500ms cubic-bezier(.2,1.2,.4,1); }
    .stk-body > div { overflow: hidden; }
    .stk.is-open .stk-body { grid-template-rows: 1fr; }
    .stk.is-sliver .stk-strip { min-height: 26px; padding-top: 6px; padding-bottom: 14px; }
    .stk.is-sliver .stk-strip > * { opacity: 0; transition: opacity 200ms; }
    .stk-inner { padding: 0 14px 16px; position: relative; min-height: 150px; }
    .stk-inner .figs { display: flex; gap: 14px; margin: 2px 0 10px; }
    .stk-inner .fig .cap { color: #1E1B18; }
    .bars5 { display: flex; align-items: flex-end; gap: 5px; height: 34px; margin: 2px 0 6px; }
    .bars5 i { width: 15px; display: block; border-radius: 2px 2px 0 0; background: repeating-linear-gradient(45deg, #1E1B18 0 1.5px, transparent 1.5px 4px); }
    .bars5 i.lead { background: #1E1B18; }
    .bars5 span { font-size: 10px; text-align: center; display: block; width: 15px; color: rgba(30,27,24,.75); font-family: 'Instrument Serif', Georgia, serif; }
    .stk .by { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 13px; color: rgba(30,27,24,.75); }
    /* left-aligned in the card flow: the floating "+" sits bottom-right, so the
       pill must never share that corner */
    .stk .go { margin-top: 10px; background: #1E1B18; color: #FAF9F6; }
    .fab { position: fixed; right: max(20px, calc(50% - 288px + 20px)); bottom: calc(22px + env(safe-area-inset-bottom)); width: 56px; height: 56px; border-radius: 50%; background: var(--ink); color: var(--paper); font-size: 28px; display: grid; place-items: center; box-shadow: 0 8px 20px var(--shadow-drag); z-index: 30; }
    .act-line { font-family: 'Instrument Serif', Georgia, serif; font-size: 16px; line-height: 1.3; padding: 6px 0; display: block; width: 100%; text-align: left; min-height: 44px; }
    .act-line .dim { font-style: italic; color: var(--ink-soft); }
    .sec-h { font-family: 'Instrument Serif', Georgia, serif; font-size: 22px; margin: 22px 0 8px; }

    /* ---------- Ranking ---------- */
